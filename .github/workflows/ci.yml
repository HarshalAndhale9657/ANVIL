name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # No secrets needed: every test is mocked or local. The Docker
        # sealed-container tests auto-skip when no daemon / base image is present
        # (container_isolation_available() -> False), so CI stays green without Docker.
        run: pytest tests/ -q
